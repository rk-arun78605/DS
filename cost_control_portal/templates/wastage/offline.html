<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Offline — Melcom Cost Control Portal</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
  <link href="/static/css/main.css" rel="stylesheet" />
</head>
<body>
<div class="login-page">
  <div class="login-card animate-fade-up text-center" style="padding:3rem 2rem">
    <i class="bi bi-wifi-off" style="font-size:4rem;color:var(--melcom-red)"></i>
    <h3 class="fw-700 mt-3">You're Offline</h3>
    <p class="text-muted">Please check your internet connection and try again.</p>
    <button onclick="window.location.reload()" class="btn btn-melcom px-4">
      <i class="bi bi-arrow-clockwise me-2"></i>Retry
    </button>
  </div>
</div>
</body>
</html>
